<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Skiper</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #0d0d14;
      --surface:  #16161f;
      --border:   #232330;
      --accent1:  #7c6fff;
      --accent2:  #3ecfab;
      --text:     #e4e4f0;
      --muted:    #55556a;
      --danger:   #ff5f7e;
      --success:  #3ecfab;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── HEADER ── */
    .header {
      position: relative;
      padding: 22px 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    /* Фоновое свечение */
    .header::before {
      content: '';
      position: absolute;
      top: -40px; left: -20px;
      width: 180px; height: 120px;
      background: radial-gradient(ellipse, rgba(124,111,255,.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-wrap {
      position: relative;
      width: 40px; height: 40px;
      flex-shrink: 0;
    }

    .logo-bg {
      position: absolute; inset: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      opacity: .15;
    }

    .logo-icon {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; line-height: 1;
    }

    .brand { flex: 1; }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .5px;
      background: linear-gradient(90deg, #fff 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .version-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      background: var(--border);
      border-radius: 20px;
      padding: 2px 7px;
      margin-top: 3px;
      letter-spacing: .3px;
    }

    /* Статус-пилюля */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      transition: all .3s;
    }

    .status-pill.on  { background: rgba(62,207,171,.12); color: var(--success); }
    .status-pill.off { background: rgba(255,95,126,.10); color: var(--danger);  }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-pill.on  .status-dot { background: var(--success); }
    .status-pill.off .status-dot { background: var(--danger); animation: none; }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1);    }
      50%      { opacity: .5; transform: scale(1.3); }
    }

    /* ── BODY ── */
    .body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

    /* Toggle row */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 16px;
      transition: border-color .2s;
    }

    .row:hover { border-color: rgba(124,111,255,.35); }

    .row-label  { font-size: 13px; font-weight: 600; }
    .row-sub    { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Switch */
    .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }

    .track {
      position: absolute; inset: 0;
      border-radius: 26px;
      background: var(--border);
      cursor: pointer;
      transition: background .3s;
    }

    .thumb {
      position: absolute;
      width: 20px; height: 20px;
      top: 3px; left: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .3s, box-shadow .3s;
      pointer-events: none;
    }

    input:checked ~ .track  { background: linear-gradient(135deg, var(--accent1), var(--accent2)); }
    input:checked ~ .thumb  { transform: translateX(20px); box-shadow: 0 0 8px rgba(62,207,171,.5); }

    /* Stats card */
    .stats-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(124,111,255,.2), rgba(62,207,171,.2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }

    .stat-info { flex: 1; }
    .stat-label { font-size: 11px; color: var(--muted); }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Skip button */
    .btn-skip {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .4px;
      position: relative;
      overflow: hidden;
      transition: opacity .2s, transform .15s;
    }

    .btn-skip::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background .2s;
    }

    .btn-skip:hover::before { background: rgba(255,255,255,.08); }
    .btn-skip:active { transform: scale(.97); }
    .btn-skip:disabled { opacity: .4; cursor: default; transform: none; }

    /* Ripple при клике */
    .btn-skip .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.3);
      width: 10px; height: 10px;
      animation: ripple .5s linear forwards;
      pointer-events: none;
    }

    @keyframes ripple {
      to { width: 300px; height: 300px; opacity: 0; margin: -150px; }
    }

    /* ── FOOTER ── */
    .footer {
      padding: 10px 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
    }

    .footer-link {
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }

    .footer-link:hover { color: var(--accent2); }

    .footer-status {
      font-size: 10px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logo-wrap">
      <div class="logo-bg"></div>
      <div class="logo-icon">⚡</div>
    </div>
    <div class="brand">
      <div class="brand-name">Skiper</div>
      <div class="version-badge">v1.1.1</div>
    </div>
    <div class="status-pill on" id="statusPill">
      <div class="status-dot"></div>
      <span id="statusText">Активен</span>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- Toggle -->
    <div class="row">
      <div>
        <div class="row-label">Автоматический скип</div>
        <div class="row-sub">Пропускать таймеры на всех сайтах</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled" checked/>
        <div class="track"></div>
        <div class="thumb"></div>
      </label>
    </div>

    <!-- Stats -->
    <div class="stats-card">
      <div class="stat-icon">🎯</div>
      <div class="stat-info">
        <div class="stat-label">Пропущено на этой странице</div>
        <div class="stat-value" id="skipCount">0</div>
      </div>
    </div>

    <!-- Manual skip -->
    <button class="btn-skip" id="manualSkip">⚡&nbsp; Пропустить сейчас</button>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <a class="footer-link" href="https://github.com/Zkfurced1/Skiper" target="_blank">github.com/Zkfurced1</a>
    <span class="footer-status" id="lastSkip">—</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
